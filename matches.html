<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Matches — LINKUP</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .matches-page {
            min-height: 100vh;
            padding: 90px 7%;
            max-width: 1200px;
            margin: auto;
        }

        .matches-header {
            text-align: center;
            margin-bottom: 55px;
        }

        .matches-header h1 {
            margin-top: 18px;
            font-size: clamp(40px, 6vw, 70px);
        }

        .matches-header p {
            margin-top: 15px;
            color: #718097;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .match-card {
            padding: 30px;
            border: 1px solid #1b2639;
            border-radius: 22px;
            background: #090e18;
            transition: .3s;
        }

        .match-card:hover {
            transform: translateY(-6px);
            border-color: #536cff;
        }

        .match-score {
            color: #00d9ff;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .match-card h2 {
            margin-top: 18px;
        }

        .match-role {
            color: #718097;
            margin-top: 7px;
            font-size: 13px;
        }

        .match-card p {
            margin-top: 18px;
            color: #8b98ab;
            line-height: 1.6;
            font-size: 14px;
        }

        .connect {
            width: 100%;
            margin-top: 25px;
            padding: 13px;

            border: 1px solid #536cff;
            border-radius: 25px;

            background: transparent;
            color: white;
        }

        .connect:hover {
            background: #536cff;
        }

        .empty {
            text-align: center;
            color: #718097;
            padding: 50px;
        }

        @media (max-width: 800px) {
            .match-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

<nav>

    <div class="logo">LINKUP</div>

    <a href="index.html"
       style="color:#8995aa;text-decoration:none;">
        ← HOME
    </a>

</nav>


<main class="matches-page">

    <div class="matches-header">

        <div class="badge">
            YOUR MATCHES
        </div>

        <h1>
            PEOPLE WHO<br>
            <span>COMPLEMENT YOU.</span>
        </h1>

        <p id="intro">
            We're looking for compatible people.
        </p>

    </div>


    <div
        id="matchGrid"
        class="match-grid">
    </div>

</main>


<script>

const profileData =
    localStorage.getItem("linkupProfile");

const matchGrid =
    document.getElementById("matchGrid");

const intro =
    document.getElementById("intro");


const people = [

    {
        name: "Arjun",
        skill: "AI / ML",
        lookingFor: "Project Partner",
        about: "Interested in building practical AI projects.",
        compatibility: 92
    },

    {
        name: "Shreya",
        skill: "Frontend Development",
        lookingFor: "Project Partner",
        about: "Enjoys creating clean and interactive web experiences.",
        compatibility: 88
    },

    {
        name: "Vikram",
        skill: "Backend Development",
        lookingFor: "Idea Collaborator",
        about: "Interested in technology products and startups.",
        compatibility: 81
    }

];


if (!profileData) {

    intro.textContent =
        "Create your profile first to discover compatible people.";

    matchGrid.innerHTML = `
        <div class="empty">
            No profile found on this device.
            <br><br>
            Go back and create your profile first.
        </div>
    `;

} else {

    const profile =
        JSON.parse(profileData);

    intro.textContent =
        "Matches based on your skills and goals.";

    people.forEach(person => {

        const card =
            document.createElement("div");

        card.className = "match-card";

        card.innerHTML = `

            <div class="match-score">
                ${person.compatibility}% COMPATIBLE
            </div>

            <h2>${person.name}</h2>

            <div class="match-role">
                ${person.skill}
            </div>

            <p>
                ${person.about}
            </p>

            <button class="connect">
                SEND CONNECTION
            </button>

        `;

        const button =
            card.querySelector(".connect");

        button.addEventListener("click", () => {

            button.textContent =
                "REQUEST SENT ✓";

            button.disabled = true;

        });

        matchGrid.appendChild(card);

    });

}

</script>

</body>
</html>
